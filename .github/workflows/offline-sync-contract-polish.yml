name: Offline sync contract polish

on:
  push:
    branches:
      - agent/offline-sync-link-up-integration

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/offline-sync-link-up-integration
          fetch-depth: 0

      - name: Polish response-code cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = Path('yak-ops-ui/src/pages/batch-link-up/SyncTaskList.tsx')
          text = legacy.read_text(encoding='utf-8')
          text = text.replace(
              "import { API_SUCCESS_CODE } from '@/services/http/response';\n",
              '',
              1,
          )
          text = text.replace('API_SUCCESS_CODE', '200')
          legacy.write_text(text, encoding='utf-8')

          model = Path('yak-ops-ui/src/pages/batch-link-up/detail/model.ts')
          text = model.read_text(encoding='utf-8')
          old = 'response?.code === 200 || response?.code === API_SUCCESS_CODE;'
          new = 'response?.code === API_SUCCESS_CODE;'
          if old not in text:
              raise SystemExit('Expected duplicate success check was not found')
          model.write_text(text.replace(old, new, 1), encoding='utf-8')

          if "import { API_SUCCESS_CODE }" in legacy.read_text(encoding='utf-8'):
              raise SystemExit('Unused API_SUCCESS_CODE import remains in legacy file')
          if '=== 200 ||' in model.read_text(encoding='utf-8'):
              raise SystemExit('Duplicate success check remains')
          PY

      - name: Commit polish and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/offline-sync-contract-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yak-ops-ui/src/pages/batch-link-up .github/workflows/offline-sync-contract-polish.yml
          git commit -m "fix(ui): polish offline sync response checks"
          git push origin HEAD:agent/offline-sync-link-up-integration
