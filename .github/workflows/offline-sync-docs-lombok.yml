name: Offline Sync Chinese Docs and Lombok

on:
  push:
    branches:
      - agent/offline-sync-docs-lombok
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  refactor:
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, '[offline-docs-applied]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Update Java documentation and Lombok usage
        run: python tools/refactor_offline_sync_docs.py | tee /tmp/refactor-first.log

      - name: Verify source changes and idempotency
        run: |
          git diff --check
          python tools/refactor_offline_sync_docs.py | tee /tmp/refactor-second.log
          grep -q 'changed=0' /tmp/refactor-second.log
          git diff --check

      - name: Compile offline-sync module when dependencies are available
        run: |
          set +e
          mvn -B \
            -pl yak-ops-business/yak-ops-business-sync/yak-ops-business-sync-offline \
            -am \
            -DskipTests \
            compile 2>&1 | tee /tmp/maven-compile.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q 'yak-framework-parent:pom:1.0.0-SNAPSHOT' /tmp/maven-compile.log; then
            echo '::warning::Maven compile was blocked because the internal yak-framework-parent snapshot is unavailable in this checkout.'
            exit 0
          fi
          exit "$status"

      - name: Commit generated source changes
        run: |
          if git diff --quiet; then
            echo "No source changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            yak-ops-business/yak-ops-business-sync/yak-ops-business-sync-offline/src/main/java \
            yak-ops-common/src/main/java/io/yak/ops/common/bean/dto/sync/offline \
            yak-ops-common/src/main/java/io/yak/ops/common/bean/po/sync/offline \
            yak-ops-common/src/main/java/io/yak/ops/common/bean/vo/sync/offline
          git commit -m "refactor(offline-sync): standardize Chinese docs and Lombok [offline-docs-applied]"
          git push origin HEAD:agent/offline-sync-docs-lombok
