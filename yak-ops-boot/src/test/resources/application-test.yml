spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false
  quartz:
    auto-startup: false

yak:
  security:
    enabled: true
    database-enabled: false
    web-enabled: false
    authentication-enabled: false
    audit-enabled: false
    permission-registration:
      enabled: false
    bootstrap:
      enabled: false
  database:
    enabled: false
  datasource:
    enabled: false
  resource:
    enabled: false
    storage:
      local:
        enabled: false
      minio:
        enabled: false
      hdfs:
        enabled: false
  sync:
    offline:
      enabled: false
  quality:
    enabled: false
  schedule:
    enabled: false
    web-enabled: false
