server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: yak-ops
  # Yak Security 保留独立数据源；Yak Ops 业务模块统一复用 yak.database。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  # 各业务模块继续维护独立 Flyway 历史表，但共享同一个业务数据源。
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${YAK_RESOURCE_MAX_FILE_SIZE:100MB}
      max-request-size: ${YAK_RESOURCE_MAX_REQUEST_SIZE:110MB}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  quartz:
    auto-startup: true
    job-store-type: memory

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operations-sorter: alpha
    tags-sorter: alpha

yak:
  security:
    enabled: true
    database-enabled: true
    web-enabled: true
    authentication-enabled: true
    audit-enabled: true
    application-name: ${YAK_SECURITY_APPLICATION_NAME:${spring.application.name}}
    public-paths:
      - /api/test/ping
      - /yak-security/api/v1/account/login
      - /yak-security/api/v1/common/heart
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
    permission-registration:
      enabled: true
    bootstrap:
      enabled: true
      username: ${YAK_SECURITY_BOOTSTRAP_USERNAME:root}
      password: ${YAK_SECURITY_BOOTSTRAP_PASSWORD:Root@123456}
      real-name: ${YAK_SECURITY_BOOTSTRAP_REAL_NAME:系统管理员}
    datasource:
      enabled: true
      url: ${YAK_SECURITY_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
      username: ${YAK_SECURITY_DATASOURCE_USERNAME:root}
      password: ${YAK_SECURITY_DATASOURCE_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 1
      min-idle: 1
      max-active: 8
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  database:
    enabled: ${YAK_DATABASE_ENABLED:true}
    # 兼容原 yak.datasource.database、yak.resource.database、yak.sync.offline.datasource 配置及环境变量。
    url: ${YAK_DATABASE_URL:${yak.datasource.database.url:${yak.resource.database.url:${yak.sync.offline.datasource.url:${YAK_DATASOURCE_URL:${YAK_RESOURCE_DATASOURCE_URL:${YAK_OFFLINE_SYNC_DATASOURCE_URL:${YAK_SECURITY_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}}}}}}}}
    username: ${YAK_DATABASE_USERNAME:${yak.datasource.database.username:${yak.resource.database.username:${yak.sync.offline.datasource.username:${YAK_DATASOURCE_USERNAME:${YAK_RESOURCE_DATASOURCE_USERNAME:${YAK_OFFLINE_SYNC_DATASOURCE_USERNAME:${YAK_SECURITY_DATASOURCE_USERNAME:root}}}}}}}}
    password: ${YAK_DATABASE_PASSWORD:${yak.datasource.database.password:${yak.resource.database.password:${yak.sync.offline.datasource.password:${YAK_DATASOURCE_PASSWORD:${YAK_RESOURCE_DATASOURCE_PASSWORD:${YAK_OFFLINE_SYNC_DATASOURCE_PASSWORD:${YAK_SECURITY_DATASOURCE_PASSWORD:123456}}}}}}}}
    driver-class-name: ${YAK_DATABASE_DRIVER:${yak.datasource.database.driver-class-name:${yak.resource.database.driver-class-name:${yak.sync.offline.datasource.driver-class-name:${YAK_DATASOURCE_DRIVER:${YAK_RESOURCE_DATASOURCE_DRIVER:${YAK_OFFLINE_SYNC_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}}}}}}}
    minimum-idle: ${YAK_DATABASE_MINIMUM_IDLE:${yak.datasource.database.minimum-idle:${yak.resource.database.minimum-idle:${yak.sync.offline.datasource.minimum-idle:1}}}}
    maximum-pool-size: ${YAK_DATABASE_MAXIMUM_POOL_SIZE:${yak.datasource.database.maximum-pool-size:${yak.resource.database.maximum-pool-size:${yak.sync.offline.datasource.maximum-pool-size:8}}}}

  datasource:
    enabled: true
    connection-test:
      timeout-seconds: ${YAK_DATASOURCE_CONNECT_TIMEOUT_SECONDS:5}

  resource:
    enabled: ${YAK_RESOURCE_ENABLED:true}
    max-file-size: ${YAK_RESOURCE_MAX_FILE_BYTES:104857600}
    editable-max-bytes: ${YAK_RESOURCE_EDITABLE_MAX_BYTES:2097152}
    storage:
      type: ${YAK_RESOURCE_STORAGE_TYPE:LOCAL}
      local:
        enabled: ${YAK_RESOURCE_LOCAL_ENABLED:true}
        base-directory: ${YAK_RESOURCE_LOCAL_BASE_DIRECTORY:./data/resources}
        checksum-enabled: ${YAK_RESOURCE_LOCAL_CHECKSUM_ENABLED:true}
      minio:
        enabled: ${YAK_RESOURCE_MINIO_ENABLED:true}
        endpoint: ${YAK_RESOURCE_MINIO_ENDPOINT:http://127.0.0.1:9000}
        access-key: ${YAK_RESOURCE_MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${YAK_RESOURCE_MINIO_SECRET_KEY:minioadmin}
        bucket: ${YAK_RESOURCE_MINIO_BUCKET:yak-ops}
        base-prefix: ${YAK_RESOURCE_MINIO_BASE_PREFIX:resources}
        auto-create-bucket: ${YAK_RESOURCE_MINIO_AUTO_CREATE_BUCKET:true}
      hdfs:
        enabled: ${YAK_RESOURCE_HDFS_ENABLED:false}
        uri: ${YAK_RESOURCE_HDFS_URI:hdfs://127.0.0.1:9000}
        user: ${YAK_RESOURCE_HDFS_USER:hdfs}
        base-directory: ${YAK_RESOURCE_HDFS_BASE_DIRECTORY:/yak-ops/resources}
        replication: ${YAK_RESOURCE_HDFS_REPLICATION:1}

  sync:
    offline:
      enabled: ${YAK_OFFLINE_SYNC_ENABLED:true}
      engine:
        enabled: ${YAK_LINK_UP_ENABLED:true}
        base-url: ${YAK_LINK_UP_BASE_URL:http://127.0.0.1:18080}
        connect-timeout: ${YAK_LINK_UP_CONNECT_TIMEOUT:10s}
        request-timeout: ${YAK_LINK_UP_REQUEST_TIMEOUT:30s}

  schedule:
    enabled: true
    web-enabled: false

logging:
  level:
    root: INFO
    io.yak.ops: INFO
    io.yak.framework.security: DEBUG
    org.flywaydb: INFO
