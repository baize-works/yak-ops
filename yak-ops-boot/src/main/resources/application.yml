server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: yak-ops
  # Yak Security、Yak Datasource、Yak Resource 和 Yak Workflow 分别维护自己的数据源与事务管理器。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  # 各业务模块自行创建并执行 Flyway。
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${YAK_RESOURCE_MAX_FILE_SIZE:100MB}
      max-request-size: ${YAK_RESOURCE_MAX_REQUEST_SIZE:110MB}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  quartz:
    auto-startup: true
    job-store-type: memory

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operations-sorter: alpha
    tags-sorter: alpha

yak:
  security:
    enabled: true
    database-enabled: true
    web-enabled: true
    authentication-enabled: true
    audit-enabled: true
    application-name: ${YAK_SECURITY_APPLICATION_NAME:${spring.application.name}}

    # Keep startup verification, signed Worker registration and API documentation public.
    # Dynamic registration performs its own HMAC authentication and replay protection.
    public-paths:
      - /api/test/ping
      - /api/v1/offline/worker-registration/**
      - /yak-security/api/v1/account/login
      - /yak-security/api/v1/common/heart
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

    permission-registration:
      enabled: true

    bootstrap:
      enabled: true
      username: ${YAK_SECURITY_BOOTSTRAP_USERNAME:root}
      password: ${YAK_SECURITY_BOOTSTRAP_PASSWORD:Root@123456}
      real-name: ${YAK_SECURITY_BOOTSTRAP_REAL_NAME:系统管理员}

    datasource:
      enabled: true
      url: ${YAK_SECURITY_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}
      username: ${YAK_SECURITY_DATASOURCE_USERNAME:root}
      password: ${YAK_SECURITY_DATASOURCE_PASSWORD:123456}
      driver-class-name: org.mariadb.jdbc.Driver
      initial-size: 1
      min-idle: 1
      max-active: 8
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  datasource:
    enabled: true
    database:
      url: ${YAK_DATASOURCE_URL:${YAK_SECURITY_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}}
      username: ${YAK_DATASOURCE_USERNAME:${YAK_SECURITY_DATASOURCE_USERNAME:root}}
      password: ${YAK_DATASOURCE_PASSWORD:${YAK_SECURITY_DATASOURCE_PASSWORD:123456}}
      driver-class-name: ${YAK_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
      minimum-idle: 1
      maximum-pool-size: 8
    connection-test:
      timeout-seconds: ${YAK_DATASOURCE_CONNECT_TIMEOUT_SECONDS:5}

  resource:
    enabled: ${YAK_RESOURCE_ENABLED:true}
    max-file-size: ${YAK_RESOURCE_MAX_FILE_BYTES:104857600}
    editable-max-bytes: ${YAK_RESOURCE_EDITABLE_MAX_BYTES:2097152}
    database:
      url: ${YAK_RESOURCE_DATASOURCE_URL:${YAK_SECURITY_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}}
      username: ${YAK_RESOURCE_DATASOURCE_USERNAME:${YAK_SECURITY_DATASOURCE_USERNAME:root}}
      password: ${YAK_RESOURCE_DATASOURCE_PASSWORD:${YAK_SECURITY_DATASOURCE_PASSWORD:123456}}
      driver-class-name: ${YAK_RESOURCE_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
      minimum-idle: 1
      maximum-pool-size: 8
    storage:
      type: ${YAK_RESOURCE_STORAGE_TYPE:LOCAL}
      local:
        enabled: ${YAK_RESOURCE_LOCAL_ENABLED:true}
        base-directory: ${YAK_RESOURCE_LOCAL_BASE_DIRECTORY:./data/resources}
        checksum-enabled: ${YAK_RESOURCE_LOCAL_CHECKSUM_ENABLED:true}
      minio:
        enabled: ${YAK_RESOURCE_MINIO_ENABLED:true}
        endpoint: ${YAK_RESOURCE_MINIO_ENDPOINT:http://127.0.0.1:9000}
        access-key: ${YAK_RESOURCE_MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${YAK_RESOURCE_MINIO_SECRET_KEY:minioadmin}
        bucket: ${YAK_RESOURCE_MINIO_BUCKET:yak-ops}
        base-prefix: ${YAK_RESOURCE_MINIO_BASE_PREFIX:resources}
        auto-create-bucket: ${YAK_RESOURCE_MINIO_AUTO_CREATE_BUCKET:true}
      hdfs:
        enabled: ${YAK_RESOURCE_HDFS_ENABLED:false}
        uri: ${YAK_RESOURCE_HDFS_URI:hdfs://127.0.0.1:9000}
        user: ${YAK_RESOURCE_HDFS_USER:hdfs}
        base-directory: ${YAK_RESOURCE_HDFS_BASE_DIRECTORY:/yak-ops/resources}
        replication: ${YAK_RESOURCE_HDFS_REPLICATION:1}

  sync:
    offline:
      enabled: ${YAK_OFFLINE_SYNC_ENABLED:true}
      datasource:
        url: ${YAK_OFFLINE_SYNC_DATASOURCE_URL:${YAK_SECURITY_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}}
        username: ${YAK_OFFLINE_SYNC_DATASOURCE_USERNAME:${YAK_SECURITY_DATASOURCE_USERNAME:root}}
        password: ${YAK_OFFLINE_SYNC_DATASOURCE_PASSWORD:${YAK_SECURITY_DATASOURCE_PASSWORD:123456}}
        driver-class-name: ${YAK_OFFLINE_SYNC_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
        minimum-idle: 1
        maximum-pool-size: 8
      engine:
        enabled: ${YAK_LINK_UP_ENABLED:true}
        base-url: ${YAK_LINK_UP_BASE_URL:http://127.0.0.1:18080}
        connect-timeout: ${YAK_LINK_UP_CONNECT_TIMEOUT:10s}
        request-timeout: ${YAK_LINK_UP_REQUEST_TIMEOUT:30s}
      registration:
        enabled: ${YAK_OFFLINE_REGISTRATION_ENABLED:false}
        secret: ${YAK_OFFLINE_REGISTRATION_SECRET:}
        auto-enable: ${YAK_OFFLINE_REGISTRATION_AUTO_ENABLE:true}
        heartbeat-interval-millis: ${YAK_OFFLINE_REGISTRATION_HEARTBEAT_MILLIS:20000}
        lease-duration-millis: ${YAK_OFFLINE_REGISTRATION_LEASE_MILLIS:90000}
        clock-skew-millis: ${YAK_OFFLINE_REGISTRATION_CLOCK_SKEW_MILLIS:300000}
        nonce-retention-millis: ${YAK_OFFLINE_REGISTRATION_NONCE_RETENTION_MILLIS:600000}
        cleanup-initial-delay-millis: ${YAK_OFFLINE_REGISTRATION_CLEANUP_INITIAL_DELAY_MILLIS:10000}
        cleanup-delay-millis: ${YAK_OFFLINE_REGISTRATION_CLEANUP_DELAY_MILLIS:10000}

  schedule:
    enabled: true
    web-enabled: false

  workflow:
    enabled: true
    datasource:
      url: ${YAK_WORKFLOW_DATASOURCE_URL:${YAK_SECURITY_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/yak_security?useUnicode=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai}}
      username: ${YAK_WORKFLOW_DATASOURCE_USERNAME:${YAK_SECURITY_DATASOURCE_USERNAME:root}}
      password: ${YAK_WORKFLOW_DATASOURCE_PASSWORD:${YAK_SECURITY_DATASOURCE_PASSWORD:123456}}
      driver-class-name: ${YAK_WORKFLOW_DATASOURCE_DRIVER:org.mariadb.jdbc.Driver}
      minimum-idle: 1
      maximum-pool-size: 8
    executor:
      core-pool-size: ${YAK_WORKFLOW_CORE_POOL_SIZE:8}
      maximum-pool-size: ${YAK_WORKFLOW_MAX_POOL_SIZE:32}
      queue-capacity: ${YAK_WORKFLOW_QUEUE_CAPACITY:500}
      default-workflow-parallelism: 4
      thread-name-prefix: yak-workflow-
    recovery:
      enabled: true
      initial-delay-millis: 5000
      fixed-delay-millis: 10000

logging:
  level:
    root: INFO
    io.yak.ops: INFO
    io.yak.framework.security: DEBUG
    org.flywaydb: INFO
